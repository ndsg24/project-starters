name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  generator:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: npm install --global pnpm@10.13.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
  node:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        template: [node-ts, nest-api, react-vite, next-app, expo-app]
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      EXPO_NO_TELEMETRY: "1"
      DESTINATION: /tmp/starter-${{ matrix.template }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: npm install --global pnpm@10.13.1
      - name: Generate isolated project
        env:
          TEMPLATE: ${{ matrix.template }}
        run: node scripts/create.mjs "$TEMPLATE" "$DESTINATION"
      - run: pnpm --dir "$DESTINATION" install --frozen-lockfile
      - run: pnpm --dir "$DESTINATION" check
      - if: matrix.template == 'node-ts' || matrix.template == 'nest-api'
        run: pnpm --dir "$DESTINATION" test:api
      - if: matrix.template == 'expo-app'
        run: pnpm --dir "$DESTINATION" build:native
      - if: matrix.template == 'react-vite' || matrix.template == 'next-app' || matrix.template == 'expo-app'
        run: pnpm install --frozen-lockfile
      - name: Browser preferences and responsive smoke
        if: matrix.template == 'react-vite' || matrix.template == 'next-app' || matrix.template == 'expo-app'
        env:
          TEMPLATE: ${{ matrix.template }}
        run: PROJECT_DIRECTORY="$DESTINATION" BROWSER_EXECUTABLE="$(command -v google-chrome)" node scripts/browser-smoke.mjs "$TEMPLATE"
      - run: pnpm --dir "$DESTINATION" audit --audit-level=high
  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
      DESTINATION: /tmp/starter-go-api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: npm install --global pnpm@10.13.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: templates/go-api/go.mod
          cache-dependency-path: templates/go-api/go.sum
      - run: node scripts/create.mjs go-api "$DESTINATION"
      - run: pnpm --dir "$DESTINATION" install --frozen-lockfile
      - run: pnpm --dir "$DESTINATION" check
      - run: pnpm --dir "$DESTINATION" test:api
      - run: pnpm --dir "$DESTINATION" audit --audit-level=high
