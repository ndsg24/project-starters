name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  generator:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: npm install --global pnpm@10.13.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
  node:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: starter
          POSTGRES_PASSWORD: starter_ci_password
          POSTGRES_DB: starter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U starter -d starter" --health-interval 2s --health-timeout 3s
          --health-retries 30
    strategy:
      fail-fast: false
      matrix:
        template: [node-ts, nest-api, react-vite, next-app, expo-app]
    env:
      CI: 'true'
      DATABASE_URL: postgresql://starter:starter_ci_password@127.0.0.1:5432/starter
      NEXT_TELEMETRY_DISABLED: '1'
      EXPO_NO_TELEMETRY: '1'
      DESTINATION: /tmp/starter-${{ matrix.template }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: npm install --global pnpm@10.13.1
      - name: Generate isolated project
        env:
          TEMPLATE: ${{ matrix.template }}
        run: node scripts/create.mjs "$TEMPLATE" "$DESTINATION"
      - run: pnpm --dir "$DESTINATION" install --frozen-lockfile
      - name: Validate Compose configuration
        run: |
          pnpm --dir "$DESTINATION" run setup --env-only
          cd "$DESTINATION"
          docker compose config --quiet
      - run: pnpm --dir "$DESTINATION" check
      - if: matrix.template == 'node-ts' || matrix.template == 'nest-api'
        run: pnpm --dir "$DESTINATION" test:integration
      - if: matrix.template == 'node-ts' || matrix.template == 'nest-api'
        run: pnpm --dir "$DESTINATION" test:api
      - if: matrix.template == 'expo-app'
        run: pnpm --dir "$DESTINATION" build:native
      - name: Verify lint and formatting after native export
        if: matrix.template == 'expo-app'
        run: |
          pnpm --dir "$DESTINATION" lint
          pnpm --dir "$DESTINATION" format:check
      - if:
          matrix.template == 'react-vite' || matrix.template == 'next-app' || matrix.template ==
          'expo-app'
        run: pnpm install --frozen-lockfile
      - name: Browser preferences and responsive smoke
        if:
          matrix.template == 'react-vite' || matrix.template == 'next-app' || matrix.template ==
          'expo-app'
        env:
          TEMPLATE: ${{ matrix.template }}
        run:
          PROJECT_DIRECTORY="$DESTINATION" BROWSER_EXECUTABLE="$(command -v google-chrome)" node
          scripts/browser-smoke.mjs "$TEMPLATE"
      - name: Build and verify Docker Compose startup
        id: compose
        run: POSTGRES_PORT=5433 pnpm --dir "$DESTINATION" docker:up
      - name: Stop verification containers
        if: always() && steps.compose.outcome != 'skipped'
        run: |
          cd "$DESTINATION"
          POSTGRES_PORT=5433 docker compose --profile app down --volumes
      - run: pnpm --dir "$DESTINATION" audit --audit-level=high
  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: starter
          POSTGRES_PASSWORD: starter_ci_password
          POSTGRES_DB: starter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U starter -d starter" --health-interval 2s --health-timeout 3s
          --health-retries 30
    env:
      CI: 'true'
      DATABASE_URL: postgresql://starter:starter_ci_password@127.0.0.1:5432/starter
      DESTINATION: /tmp/starter-go-api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: npm install --global pnpm@10.13.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: templates/go-api/go.mod
          cache-dependency-path: templates/go-api/go.sum
      - run: node scripts/create.mjs go-api "$DESTINATION"
      - run: pnpm --dir "$DESTINATION" install --frozen-lockfile
      - name: Validate Compose configuration
        run: |
          pnpm --dir "$DESTINATION" run setup --env-only
          cd "$DESTINATION"
          docker compose config --quiet
      - run: pnpm --dir "$DESTINATION" check
      - run: pnpm --dir "$DESTINATION" test:integration
      - run: pnpm --dir "$DESTINATION" test:api
      - name: Build and verify Docker Compose startup
        id: compose
        run: POSTGRES_PORT=5433 pnpm --dir "$DESTINATION" docker:up
      - name: Stop verification containers
        if: always() && steps.compose.outcome != 'skipped'
        run: |
          cd "$DESTINATION"
          POSTGRES_PORT=5433 docker compose --profile app down --volumes
      - run: pnpm --dir "$DESTINATION" audit --audit-level=high
