services:
  web:
    build: .
    env_file: .env
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
      WATCHPACK_POLLING: 'true'
      CHOKIDAR_USEPOLLING: 'true'
      API_URL: http://host.docker.internal:4000
    ports:
      - '${WEB_PORT:-3000}:3000'
    volumes:
      - .:/app
      - node-modules:/app/node_modules
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    init: true
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() =>
          process.exit(1))",
        ]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 60s
volumes:
  node-modules:
