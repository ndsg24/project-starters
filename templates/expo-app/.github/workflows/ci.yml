name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: npm install --global pnpm@10.13.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm setup --env-only
      - run: docker compose config --quiet
      - run: pnpm check
      - run: pnpm build:native
      - run: pnpm lint && pnpm format:check
      - name: Build and verify Docker Compose startup
        id: compose
        run: POSTGRES_PORT=5433 pnpm docker:up
      - name: Stop verification containers
        if: always() && steps.compose.outcome != 'skipped'
        run: POSTGRES_PORT=5433 docker compose --profile app down --volumes
      - run: pnpm audit --audit-level=high
